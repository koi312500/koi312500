<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>Page not found | Geonwoo Kim</title>
    <style>
      :root {
        font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
        color: #171717;
        background: #fffdfb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background-image: radial-gradient(
          circle,
          rgba(34, 34, 34, 0.055) 1.6px,
          transparent 1.8px
        );
        background-size: 14px 14px;
      }
      main {
        width: min(90%, 42rem);
        padding: 3rem;
        background: rgba(255, 253, 251, 0.92);
        border-left: 0.7rem solid #ff7a66;
        box-shadow: 0 25px 80px rgba(45, 31, 25, 0.12);
      }
      p:first-child {
        margin: 0;
        color: #f26652;
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      h1 {
        margin: 0.7rem 0;
        font-size: clamp(2.4rem, 8vw, 5.5rem);
        line-height: 0.95;
      }
      p {
        color: #4b4b4b;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.9rem 1.2rem;
        color: white;
        font-weight: 700;
        text-decoration: none;
        background: #ff7a66;
      }
      a:focus-visible {
        outline: 3px solid #171717;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Lost in the grid.</h1>
      <p>
        The page you requested does not exist. The portfolio is still right
        where it should be.
      </p>
      <a href="/#about">Return to the portfolio</a>
    </main>
  </body>
</html>
