<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="An archive of artwork drawn for Geonwoo Kim, with artists, dates, and collection numbers."
    />
    <meta name="theme-color" content="#171717" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("portfolio-theme") === "dark" ? "dark" : "light";
      if (window.location.pathname === "/gallery/") {
        window.history.replaceState(null, "", "/gallery");
      }
    </script>
    <link rel="stylesheet" href="/utility/utility.css" />
    <link rel="stylesheet" href="/gallery/gallery.css" />
    <title>KOI Art Archive | Geonwoo Kim</title>
    <script src="/utility/utility.js" defer></script>
    <script src="/gallery/gallery-data.js" defer></script>
    <script src="/gallery/gallery.js" defer></script>
  </head>
  <body
    data-title-en="KOI Art Archive | Geonwoo Kim"
    data-title-ko="코이 그림 저장소 | 김건우"
    data-description-en="An archive of artwork drawn for Geonwoo Kim, with artists, dates, and collection numbers."
    data-description-ko="김건우를 그린 그림을 작가, 받은 날짜, 기록 번호와 함께 모은 갤러리입니다."
  >
    <main class="utility-shell gallery-shell">
      <header class="utility-topbar">
        <a class="utility-brand" href="/about">KOI3125</a>
        <div class="utility-actions">
          <a class="utility-action gallery-map-link" href="/sitemap" aria-label="Site map">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18" />
              <path d="M12 3a14.5 14.5 0 0 1 0 18" />
              <path d="M12 3a14.5 14.5 0 0 0 0 18" />
            </svg>
          </a>
          <button
            class="utility-action utility-action--language"
            type="button"
            data-language-toggle
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 8 6 6" />
              <path d="m4 14 6-6 2-3" />
              <path d="M2 5h12" />
              <path d="M7 2h1" />
              <path d="m22 22-5-10-5 10" />
              <path d="M14 18h6" />
            </svg>
          </button>
          <button
            class="utility-action utility-action--theme"
            type="button"
            data-theme-toggle
          >
            <svg data-theme-icon="light" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
            <svg data-theme-icon="dark" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M12 3a6 6 0 0 0 9 9 9 0 1 1-9-9Z" />
            </svg>
          </button>
        </div>
      </header>

      <div class="utility-heading">
        <p class="utility-kicker" data-language="en">Gallery</p>
        <p class="utility-kicker" data-language="ko" hidden>Gallery</p>
      </div>
      <div class="gallery-intro">
        <h1 class="utility-title" data-language="en">KOI Art Archive</h1>
        <h1 class="utility-title" data-language="ko" hidden>코이 그림 저장소</h1>
        <p class="utility-lede" data-language="en">
          Dates are omitted for early artwork when the exact date could not be verified.
        </p>
        <p class="utility-lede" data-language="ko" hidden>
          정확한 날짜를 확인하기 어려운 초기 그림은 연도를 생략했습니다.
        </p>
      </div>

      <section class="gallery-section" aria-labelledby="gallery-count">
        <div class="gallery-section__head">
          <p id="gallery-count" aria-live="polite"></p>
          <p data-language="en">Newest first</p>
          <p data-language="ko" hidden>최신순</p>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </section>

    </main>

    <dialog class="artwork-dialog" id="artwork-dialog" aria-labelledby="dialog-title">
      <div class="artwork-dialog__panel">
        <button class="dialog-close" type="button" data-dialog-close aria-label="Close">×</button>
        <div class="dialog-heading">
          <p class="dialog-number" id="dialog-number"></p>
          <h2 id="dialog-title"></h2>
          <dl class="dialog-meta" id="dialog-meta"></dl>
        </div>
        <div class="dialog-images" id="dialog-images"></div>
      </div>
    </dialog>
  </body>
</html>
